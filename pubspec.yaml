name: ridekaro
description: "A ride sharing app"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  google_maps_flutter: ^2.6.1
  permission_handler: ^11.3.1
  geocoding: ^2.1.0
  geolocator: ^12.0.0
  google_maps_webservice: ^0.0.19
  flutter_polyline_points: ^3.0.1

  http: ^1.2.1 # Requesting the modern version
  uuid: ^4.4.0 # Needed for the places_search_widget

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  http: ^1.2.1